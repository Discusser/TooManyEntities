# Done to increase the memory available to Gradle.
# Minecraft 26.1+ requires Java 25 for the Gradle JVM (see https://fabricmc.net/2026/03/14/261.html).
# Point Gradle at JDK 25 if needed, e.g. org.gradle.java.home=/path/to/jdk-25
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
mod_version = 1.2.2
maven_group = io.github.discusser.toomanyentities
archives_name = too_many_entities
enabled_platforms = fabric,neoforge

# Minecraft properties — build against 26.1.2; runs on 26.1–26.1.2
minecraft_version = 26.1.2
# Fabric: bracket ranges like [26.1,26.2) do not match 26.1.2 — use explicit bounds (see OldSchoolJail / CTOV)
fabric_minecraft_version_range = >=26.1 <26.2
neoforge_minecraft_version_range = [26.1,26.2)

# Dependencies
architectury_api_version = 19.0.1
fabric_loader_version = 0.19.2
fabric_api_version = 0.149.1+26.1.2
neoforge_version = 26.1.2.65-beta

clothconfig_version = 26.1.154
modmenu_version = 18.0.0-beta.1
entityculling_version = 1.10.2
