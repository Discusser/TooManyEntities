plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.tr7zw.dev/repository/maven-snapshots/" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    api("me.shedaniel.cloth:cloth-config-fabric:$project.clothconfig_version")
    compileOnly("com.terraformersmc:modmenu:$project.modmenu_version")
    localRuntime("com.terraformersmc:modmenu:$project.modmenu_version")

    compileOnly("maven.modrinth:entityculling:$project.entityculling_version-fabric,$project.minecraft_version")
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'fabric_loader_version', fabric_loader_version
    inputs.property 'fabric_api_version', fabric_api_version
    inputs.property 'minecraft_version', minecraft_version
    inputs.property 'clothconfig_version', clothconfig_version
    inputs.property 'entityculling_version', entityculling_version
    inputs.property 'modmenu_version', modmenu_version

    filesMatching('fabric.mod.json') {
        expand(version: project.version, fabric_loader_version: fabric_loader_version, fabric_api_version: fabric_api_version,
                minecraft_version: minecraft_version,
                clothconfig_version: clothconfig_version, entityculling_version: entityculling_version,
                modmenu_version: modmenu_version)
    }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}


publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
    }
}