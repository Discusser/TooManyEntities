plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    modApi("me.shedaniel.cloth:cloth-config-fabric:$project.clothconfig_version")
    modImplementation("com.terraformersmc:modmenu:$project.modmenu_version")

    modImplementation("maven.modrinth:entityculling:$project.entityculling_version-fabric,$project.minecraft_version")
    modImplementation "dev.tr7zw:TRansition:${project.transition_version}-fabric-SNAPSHOT@jar"
    modImplementation "dev.tr7zw:TRender:${project.trender_version}-fabric-SNAPSHOT@jar"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'fabric_loader_version', fabric_loader_version
    inputs.property 'minecraft_version', minecraft_version
    inputs.property 'architectury_api_version', architectury_api_version
    inputs.property 'clothconfig_version', clothconfig_version
    inputs.property 'entityculling_version', entityculling_version
    inputs.property 'modmenu_version', modmenu_version

    filesMatching('fabric.mod.json') {
        expand(version: project.version, fabric_loader_version: fabric_loader_version, minecraft_version: minecraft_version,
                architectury_api_version: architectury_api_version, clothconfig_version: clothconfig_version,
                entityculling_version: entityculling_version, modmenu_version: modmenu_version)
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
